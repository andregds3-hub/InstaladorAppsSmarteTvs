{% extends "base.html" %}
{% block title %}Configurações{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Configurações</h1>
<form method="post" action="/admin/settings" class="card card-body mb-4">
  <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
  <div class="form-check form-switch">
    <input class="form-check-input" type="checkbox" role="switch" name="clients_on" value="true" id="clients_on" {% if clients_enabled %}checked{% endif %}>
    <label class="form-check-label" for="clients_on">Exigir código de acesso no app Android</label>
  </div>
  <div class="form-text">Ligado: o app só lista apps depois de digitar um código gerado em Clientes. Tokens antigos sem código deixam de valer.</div>
  <div class="mt-3"><button class="btn btn-primary">Salvar</button></div>
</form>

<h2 class="h5">Trocar senha</h2>
<form method="post" action="/admin/password" class="card card-body" style="max-width: 28rem">
  <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
  <label class="form-label">Senha atual<input name="current" type="password" class="form-control" autocomplete="current-password" required></label>
  <label class="form-label">Nova senha (10+ caracteres)<input name="new" type="password" class="form-control" autocomplete="new-password" minlength="10" required></label>
  <label class="form-label">Confirmar<input name="confirm" type="password" class="form-control" autocomplete="new-password" required></label>
  <button class="btn btn-primary mt-2">Alterar</button>
</form>
{% endblock %}
