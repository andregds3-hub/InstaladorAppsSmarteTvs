<input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
<div class="row g-3">
  <div class="col-md-6">
    <label class="form-label">Nome<input name="name" class="form-control" maxlength="120" required value="{{ app.name if app else '' }}"></label>
  </div>
  <div class="col-md-3">
    <label class="form-label">Plataforma
      <select name="platform" class="form-select" {% if app and app.versions %}disabled{% endif %}>
        {% for key, label in platforms.items() %}
        <option value="{{ key }}" {% if app and app.platform == key %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    {% if app and app.versions %}<input type="hidden" name="platform" value="{{ app.platform }}">{% endif %}
  </div>
  <div class="col-md-3">
    <label class="form-label">Ordem de exibição<input name="display_order" type="number" class="form-control" value="{{ app.display_order if app else 0 }}"></label>
  </div>
  <div class="col-12">
    <label class="form-label w-100">Descrição<textarea name="description" class="form-control" rows="3">{{ app.description if app else '' }}</textarea></label>
  </div>
  <div class="col-md-6">
    <label class="form-label">Ícone (PNG/JPG/WEBP, até 1 MB)<input name="icon" type="file" accept=".png,.jpg,.jpeg,.webp" class="form-control"></label>
  </div>
  <div class="col-md-6 d-flex align-items-end">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="active" value="true" id="active" {% if not app or app.active %}checked{% endif %}>
      <label class="form-check-label" for="active">Ativo (aparece no app Android)</label>
    </div>
  </div>
</div>
