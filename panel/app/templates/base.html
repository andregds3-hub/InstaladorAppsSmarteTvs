<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Instalador TV{% endblock %} · Painel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
{% if request.session.get('admin_id') %}
<nav class="navbar navbar-expand-md bg-body-tertiary border-bottom mb-4">
  <div class="container">
    <a class="navbar-brand" href="/admin/apps">Instalador TV</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="/admin/apps">Apps</a>
      <a class="nav-link" href="/admin/devices">TVs</a>
      <a class="nav-link" href="/admin/installs">Instalações</a>
      <a class="nav-link" href="/admin/clients">Clientes</a>
      <a class="nav-link" href="/admin/settings">Configurações</a>
    </div>
    <form method="post" action="/admin/logout" class="d-flex">
      <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
      <button class="btn btn-outline-secondary btn-sm">Sair</button>
    </form>
  </div>
</nav>
{% endif %}
<main class="container pb-5">
  {% for f in flashes %}
  <div class="alert alert-{{ f.kind }} alert-dismissible" role="alert">{{ f.message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
